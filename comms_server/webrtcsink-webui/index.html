<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Pi-Cam Viewer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    /* App layout: header (status) / content (video) / footer (button) */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #topbar {
      flex: 0 0 auto;
      background: #000;
      padding: 10px 10px;
    }

    #status {
      display: inline-block;
      padding: 10px 10px;
      background: #222;
      border-radius: 6px;
    }

    #content {
      flex: 1 1 auto;
      min-height: 0;
      /* allows child to size properly */
      display: flex;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    #bottombar {
      flex: 0 0 auto;
      background: #000;
      padding: 10px;
      display: flex;
      justify-content: flex-end;
    }

    #toggleLog {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #222;
      color: #eee;
      border: none;
      padding: 10px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      z-index: 2000; /* make sure it stays above video */
    }

    #toggleLog:hover {
      background: #333;
    }

    /* Log panel remains a floating overlay (only when shown) */
    #log {
      position: fixed;
      right: 10px;
      bottom: 10px;
      width: 48vw;
      max-width: 560px;
      height: 40vh; /* shorter since it's at the bottom */
      overflow: auto;
      background: #000c;
      font: 12px ui-monospace, monospace;
      padding: 8px;
      display: none;
      border-radius: 8px;
      border: 1px solid #333;
    }

    #log pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="topbar">
      <span id="status">Connecting…</span>
    </div>

    <div id="content">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="bottombar">
      <button id="toggleLog">Show Log</button>
    </div>
  </div>

  <div id="log">
    <pre id="pre"></pre>
  </div>

  <script>
    const STREAM = "pi-cam";
    const WS_URL = "ws://" + location.hostname + ":8443"; // use ws://127.0.0.1:8443 if testing on same laptop

    const statusEl = document.getElementById("status");
    const videoEl = document.getElementById("video");
    const pre = document.getElementById("pre");
    const logEl = document.getElementById("log");
    const toggleBtn = document.getElementById("toggleLog");

    let ws, pc, myId = null, producerId = null, started = false, pollIv = null, sessionId = null;

    // --- Log UI helpers ---
    function setLogVisible(show) {
      logEl.style.display = show ? "block" : "none";
      toggleBtn.textContent = show ? "Hide Log" : "Show Log";
    }
    function autoHideLogSoon() {
      // Hide only when ICE is connected/completed AND we have a media track
      const iceOk = pc && (pc.iceConnectionState === "connected" || pc.iceConnectionState === "completed");
      const hasMedia = videoEl.srcObject && videoEl.srcObject.getTracks().length > 0;
      if (iceOk && hasMedia) {
        setTimeout(() => setLogVisible(false), 800);
      }
    }

    // Start with log visible
    setLogVisible(true);

    toggleBtn.addEventListener("click", () => {
      setLogVisible(logEl.style.display === "none");
    });

    function ui(s) { statusEl.textContent = s; console.log(s); }
    function dbg(o) { try { pre.textContent += (typeof o === "string" ? o : JSON.stringify(o)) + "\n"; pre.scrollTop = pre.scrollHeight; } catch { } }
    function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

    function startVariants() {
      if (started || !producerId) return;
      started = true;
      if (pollIv) { clearInterval(pollIv); pollIv = null; }
      ui("Starting session with " + producerId + " …");
      // these variants are accepted by different rswebrtc builds:
      send({ type: "startSession", peerId: producerId });
      send({ type: "startSession", peer: producerId });
      send({ type: "startSession", otherPeerId: producerId });
      send({ type: "startSession", meta: { name: STREAM } }); // name-only fallback
    }

    function init() {
      ui("WS connecting…");
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        ui("WS open → newPeer …");
        send({ type: "newPeer" });

        pc = new RTCPeerConnection({ sdpSemantics: "unified-plan" });
        pc.addTransceiver("video", { direction: "recvonly" });
        pc.ontrack = e => {
          videoEl.srcObject = e.streams[0];
          // When media arrives, try to auto-hide log if ICE is already connected
          autoHideLogSoon();
        };

        pc.onicecandidate = e => {
          if (!sessionId) return;
          if (e.candidate) {
            send({ type: "peer", sessionId, ice: e.candidate });
          } else {
            send({ type: "peer", sessionId, ice: { candidate: "", sdpMLineIndex: 0 } });
          }
        };

        pc.oniceconnectionstatechange = () => {
          ui("ICE: " + pc.iceConnectionState);
          // When ICE reaches connected/completed, try to auto-hide the log
          autoHideLogSoon();
        };
      };

      ws.onmessage = async ev => {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        dbg(msg);

        if (msg.type === "welcome" && msg.peerId) {
          myId = msg.peerId;
          ui("Registered consumer: " + myId);
          send({ type: "setPeerStatus", roles: ["consumer"], meta: { name: STREAM } });
          pollIv = setInterval(() => { if (!started) send({ type: "list" }); }, 500);
          return;
        }

        if (msg.type === "sessionStarted" && msg.sessionId) {
          sessionId = msg.sessionId;
          dbg("sessionId=" + sessionId);
          return;
        }

        if (msg.type === "list" && Array.isArray(msg.producers)) {
          const p = msg.producers.find(x => x?.meta?.name === STREAM) || msg.producers[0];
          if (p && p.id && !producerId) { producerId = p.id; dbg("producerId=" + producerId); startVariants(); }
          return;
        }

        if (msg.type === "peer" && msg.sessionId) {
          if (!sessionId) sessionId = msg.sessionId;

          if (msg.sdp && msg.sdp.type === "offer" && msg.sdp.sdp) {
            ui("Offer received; answering …");
            await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp.sdp });
            const ans = await pc.createAnswer();
            await pc.setLocalDescription(ans);
            send({ type: "peer", sessionId, sdp: { type: "answer", sdp: ans.sdp } });
            ui("Answer sent.");
            return;
          }

          if (msg.ice) {
            try { await pc.addIceCandidate(msg.ice); } catch (e) { console.warn("addIceCandidate failed", e); }
            return;
          }
        }
      };

      ws.onerror = () => { ui("WS error"); setLogVisible(true); };
      ws.onclose = () => { ui("WS closed"); setLogVisible(true); };
    }

    window.onload = init;
  </script>
</body>

</html>
